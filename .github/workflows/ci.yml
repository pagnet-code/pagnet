name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # This runner shares a 28-core host (vLLM + other org runners + owner
  # work). Unbounded suites (GOMAXPROCS=28 x 28 parallel test packages)
  # oversubscribed the host ~28x and starved goroutines in the transpiled
  # sqlite parser for 19m+ (durable package timeouts on 2026-10-09).
  # Bounded to 8 procs/binary, 2 packages in parallel = max 16 cores.
  GOMAXPROCS: "8"

jobs:
  go:
    # Self-hosted runner (pagnet-code org): the account's GitHub-hosted
    # runner billing is broken, so CI runs on the org's own infrastructure.
    # SECURITY (public repo): the self-hosted runner never executes FORK-PR
    # (untrusted) code — same-repo PRs and pushes run, fork PRs skip.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, self-hosted-linux, owl-deploy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # This persistent runner already retains Go's native caches.
          # Remote restore collides with existing read-only module files.
          cache: false
      - run: go build ./...
      - run: go vet ./...
      # Cross-arch vet: the org has no Mac runner, and plain `go build`
      # does not type test files — the darwin build (including tests)
      # must compile, and the fleet includes arm64 hosts.
      - run: GOOS=darwin GOARCH=arm64 go vet ./...
      - run: GOOS=linux GOARCH=arm64 go vet ./...
      # Windows remote clients compile on Linux; native host execution stays unsupported.
      - run: GOOS=windows GOARCH=amd64 go build -o /tmp/pagnet-windows-amd64.exe ./cmd/pagnet
      - run: GOOS=windows GOARCH=arm64 go build -o /tmp/pagnet-windows-arm64.exe ./cmd/pagnet
      - run: GOOS=windows GOARCH=amd64 go vet ./sdk ./e2ee ./internal/externalbridge
      # Match Makefile TEST_TIMEOUT: FULL-fsync worker subprocess fixtures
      # need headroom above Go's default 10m on slower CI disks. Each package
      # remains bounded; failures and races still fail the job.
      # -skip: the search timing gates assert wall-clock p99 against budgets
      # locked from -race measurements (see fabric/search/perf_test.go); they
      # run in their own non-race step below, where the measurement the
      # budgets describe actually happens.
      - run: go test -timeout=20m -count=1 -p 2 -skip 'TestSearchPerformanceTargets|TestSearchAdversarialWorstCase' ./...
      # -race: pagnet pushes BEFORE the monorepo pointer bump, so a
      # regression only the race detector catches must fail here, not
      # first in the monorepo (the 2026-09-29 stderr-drain race). The P0
      # process stress fixtures are bounded by default (the heavy variant
      # is opt-in via PAGNET_PROC_STRESS, unset in CI), so the detector's
      # overhead is safe on the runner. The search timing gates are skipped
      # here for the same reason as the non-race step.
      - run: go test -timeout=20m -count=1 -race -p 2 -skip 'TestSearchPerformanceTargets|TestSearchAdversarialWorstCase' ./...
      # Search-quality gates (VNEXT E4.3): the swappability conformance gate
      # against the fabric.SearchBackend contract, the committed relevance
      # corpus (>= 50 expert-graded cases), the locked 10k/100k/1M p99
      # search budgets, and the adversarial worst-case regression. Each is an
      # explicit step so a gate failure is named in the log.
      - name: search conformance gate (fabric.SearchBackend contract)
        run: go test -count=1 -run TestSearchBackendConformance -v ./fabric/search/...
      - name: search relevance corpus gate (>= 50 graded cases)
        run: go test -count=1 -run TestRelevanceCorpus -v ./fabric/search/...
      - name: search performance targets (10k/100k/1M p99 budgets)
        run: go test -count=1 -run TestSearchPerformanceTargets -v ./fabric/search/...
      - name: search adversarial worst-case gate (bounded budget)
        run: go test -count=1 -run TestSearchAdversarialWorstCase -v ./fabric/search/...
      - run: test -z "$(gofmt -l .)"
