# Worker-tarball releases for the open-source pagnet client. Ported from the
# pagnet monorepo's Release workflow in the repo split — this repo owns its
# releases now: `make release` at this root builds the tarballs, and the
# control plane serves them at /download/ (PAGNET_RELEASE_DIR).
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
  # Re-runs the tag lane from this branch's workflow: after a fix here, a
  # tag whose release run failed can be rebuilt and published without
  # moving the tag (moving it would change the module version that
  # downstream go.sum pins already resolve).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v0.10.0'
        required: true
        type: string

# The rolling dev publish is a delete+create pair: a second dev run (or a
# tag run) interleaving with it could leave the dev release deleted or
# clobbered. Serialize each lane; tag and dev lanes may run in parallel.
concurrency:
  group: release-${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev' }}
  cancel-in-progress: false

# Creating/deleting releases needs write on the contents scope.
permissions:
  contents: write

jobs:
  release:
    name: build + publish (${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev' }})
    # Self-hosted runner (pagnet-code org): the account's GitHub-hosted
    # runner billing is broken, so CI runs on the org's own infrastructure.
    runs-on: [self-hosted, self-hosted-linux, owl-deploy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `git describe --tags` (the release VERSION) can
          # resolve the tag instead of falling back to a bare commit hash.
          fetch-depth: 0
          # A dispatch re-run checks out the tag it is releasing; push runs
          # check out the pushed ref as usual.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Keep the persistent runner's native Go caches; do not restore
          # an archive over existing read-only module files.
          cache: false

      - name: Resolve one SemVer build version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_TAG:-}" ]]; then
            RELEASE_VERSION="$(sh scripts/version.sh --stable "$DISPATCH_TAG")"
            echo "RELEASE_TAG=$DISPATCH_TAG" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_VERSION="$(sh scripts/version.sh --stable "$GITHUB_REF_NAME")"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            RELEASE_VERSION="$(sh scripts/version.sh)"
          fi
          sh scripts/version.sh --validate "$RELEASE_VERSION" >/dev/null
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "building $RELEASE_VERSION"

      # Release runs independently of CI, including tag pushes. Never sign
      # or publish a build whose own revision fails the correctness gates.
      # The wall-clock search gates (performance targets, adversarial worst
      # case) lock p99 budgets measured in a clean single-package run (see
      # fabric/search/perf_test.go), so — exactly as in CI — the parallel
      # suite skips them and each runs in its own dedicated step.
      - name: Verify release revision
        run: |
          go vet ./...
          go test -timeout=20m -count=1 -race -skip 'TestSearchPerformanceTargets|TestSearchAdversarialWorstCase' ./...
          go test -count=1 -run TestSearchBackendConformance -v ./fabric/search/...
          go test -count=1 -run TestRelevanceCorpus -v ./fabric/search/...
          go test -count=1 -run TestSearchPerformanceTargets -v ./fabric/search/...
          go test -count=1 -run TestSearchAdversarialWorstCase -v ./fabric/search/...

      # Cross-compiles the unified pagnet binary for
      # linux/{amd64,arm64} and darwin/{amd64,arm64} into dist/
      # (one executable + LICENSE + README per tarball), plus the stable
      # pagnet-latest-<os>-<arch>.tar.gz copies. All four targets build
      # with CGO_ENABLED=0 (see the Makefile release target) — the
      # dependency graph must stay cross-compilable.
      - name: Build release tarballs
        # The tag lane must NOT take its version from `git describe`: the
        # rolling dev tag can land on the very same commit as a version tag
        # (both lanes fire on one release push), and describe then resolves
        # "dev" — which mislabeled the v0.3.0 assets on 2026-09-21. The tag
        # name IS the version there, so pass it explicitly.
        run: make release VERSION="$RELEASE_VERSION"

      # ARCHITECTURE PROOF: `file` on the four release binaries. The
      # release contract is four native artifacts (linux/{amd64,arm64},
      # darwin/{amd64,arm64}); a wrong-arch or CGO-linked binary is a
      # release defect, so the matrix is proven, not assumed.
      - name: Verify release artifacts (file)
        run: |
          set -e
          command -v file >/dev/null || sudo apt-get install -y file
          for t in "linux/amd64:ELF 64-bit.*x86-64" "linux/arm64:ELF 64-bit.*aarch64" "darwin/amd64:Mach-O 64-bit.*x86_64" "darwin/arm64:Mach-O 64-bit.*arm64"; do
            os_arch=${t%%:*}; want=${t#*:}
            os=${os_arch%/*}; arch=${os_arch#*/}
            d=$(mktemp -d)
            tar -C "$d" -xzf "dist/pagnet-latest-$os-$arch.tar.gz" pagnet
            out=$(file -b "$d/pagnet")
            echo "$os/$arch => $out"
            echo "$out" | grep -qE "$want" || { echo "UNEXPECTED ARTIFACT TYPE for $os/$arch"; rm -rf "$d"; exit 1; }
            rm -rf "$d"
          done

      # Never publish an unsigned release: the installer and updater
      # require this pinned-key manifest, including on the rolling lane.
      - name: Sign release manifest
        env:
          PAGNET_RELEASE_SIGNING_KEY: ${{ secrets.PAGNET_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${PAGNET_RELEASE_SIGNING_KEY}" ]; then
            echo "::error::PAGNET_RELEASE_SIGNING_KEY is not set — refusing to publish unsigned artifacts."
            exit 1
          fi
          make release-sign VERSION="$RELEASE_VERSION"

      - name: List artifacts
        run: |
          ls -1 dist/pagnet-*.tar.gz
          ls -1 dist/pagnet-release-manifest-*.json

      # The publish steps talk to the GitHub REST API directly (curl +
      # GITHUB_TOKEN, jq) instead of the gh CLI: the shared self-hosted
      # runner image ships no gh, and a release lane must not depend on a
      # host tool installed out-of-band — that silent dependency broke the
      # lane when the runner container was recreated (2026-09-18).

      - name: Publish tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          base="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          # A dispatch re-run (RELEASE_TAG) builds the checked-out tag, so the
          # release pins that commit — not the branch HEAD the run came from.
          sha=$(git rev-parse HEAD)
          # Resume an incomplete draft after a failed upload. Published stable
          # releases are immutable: deleting their assets on a rerun would
          # interrupt installs and replace already trusted signed artifacts.
          rel=$(api "${base}/releases/tags/${RELEASE_TAG}" 2>/dev/null || true)
          rel_id=$(echo "${rel}" | jq -r '.id // empty' 2>/dev/null || true)
          shopt -s nullglob
          if [ -n "${rel_id}" ]; then
            if [ "$(echo "${rel}" | jq -r '.draft')" != "true" ]; then
              echo "::error::${RELEASE_TAG} is already published and immutable. Publish a new version instead."
              exit 1
            fi
            echo "resuming draft release ${rel_id} for ${RELEASE_TAG}"
            for f in dist/pagnet-*.tar.gz dist/pagnet-release-manifest-*.json; do
              aid=$(api "${base}/releases/${rel_id}/assets" | jq -r --arg n "$(basename "$f")" '.[] | select(.name == $n) | .id' | head -1)
              if [ -n "${aid}" ]; then api -X DELETE "${base}/releases/assets/${aid}" >/dev/null; fi
            done
          else
          # A regular (non-prerelease) release is the "Latest" one GitHub
          # shows; target_commitish pins the tag if it does not exist yet.
          # jq object values are simple expressions only — the body is
          # composed in the shell and passed with --arg.
          rel=$(api -X POST "${base}/releases" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg tag "${RELEASE_TAG}" --arg sha "${sha}" --arg body "pagnet ${RELEASE_TAG}" \
                 '{tag_name: $tag, name: $tag, target_commitish: $sha, draft: true, prerelease: false, body: $body}')")
          rel_id=$(echo "$rel" | jq -r .id)
          fi
          # Uploads go to uploads.github.com (not the API host). The API's
          # upload_url is a template for this same path; composing it
          # directly keeps both branches on one code path.
          upload_base="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rel_id}/assets"
          # Both binaries and the mandatory signed manifests publish together.
          for f in dist/pagnet-*.tar.gz dist/pagnet-release-manifest-*.json; do
            # -L: the asset upload URL redirects to the storage backend.
            api -L "${upload_base}?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" -o /dev/null
          done
          # Publish/promote only after every binary and signed manifest is
          # uploaded. The previous latest release stays available meanwhile.
          api -X PATCH "${base}/releases/${rel_id}" \
            -H "Content-Type: application/json" \
            -d '{"draft":false,"prerelease":false,"make_latest":"true"}' -o /dev/null
          echo "published ${RELEASE_TAG}"

      - name: Publish rolling dev release
        if: github.ref == 'refs/heads/main' && inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          base="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          # Replace the rolling "dev" release on every main push so there is
          # always a current dev build to grab: release assets cannot be
          # replaced in place, so delete the previous release and its tag,
          # then recreate (the API re-creates the tag at this commit).
          rid=$(api "${base}/releases/tags/dev" | jq -r '.id') || rid=""
          if [ -n "${rid}" ] && [ "${rid}" != "null" ]; then
            api -X DELETE "${base}/releases/${rid}"
            api -X DELETE "${base}/git/refs/tags/dev"
          fi
          rel=$(api -X POST "${base}/releases" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg sha "${GITHUB_SHA}" --arg body "Rolling dev build (${GITHUB_SHA::7})" \
                 '{tag_name: "dev", name: "dev", target_commitish: $sha, draft: false, prerelease: true, body: $body}')")
          # upload_url is a template — substitute, don't append (see the
          # tag lane).
          upload=$(echo "$rel" | jq -r .upload_url)
          upload_base="${upload%%{*}"
          shopt -s nullglob
          for f in dist/pagnet-*.tar.gz dist/pagnet-release-manifest-*.json; do
            api -L "${upload_base}?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" -o /dev/null
          done
          echo "published dev (${GITHUB_SHA::7})"
