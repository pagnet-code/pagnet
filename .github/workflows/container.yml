name: Client container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable version tag to retry, e.g. v0.10.0 (empty builds main)'
        required: false
        type: string

# Serialize the immutable-tag existence checks with publication, including
# retries, per ref so main pushes cannot replace pending stable releases.
# Manual stable retries share the corresponding tag's publication lane.
concurrency:
  group: client-container-publish-${{ inputs.tag || (github.event_name == 'workflow_dispatch' && 'main') || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/pagnet-code/pagnet

jobs:
  container:
    runs-on: [self-hosted, self-hosted-linux, owl-deploy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || (github.event_name == 'workflow_dispatch' && 'main') || github.ref }}

      - name: Resolve image version
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-}"
          if [[ -z "$tag" && "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            version="$(sh scripts/version.sh --stable "$tag")"
          else
            version="$(sh scripts/version.sh)"
          fi
          sh scripts/version.sh --validate "$version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify container revision
        run: |
          go vet ./...
          go test -race -count=1 ./cmd/pagnet ./internal/runtimeconnect

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select unpublished immutable tags
        id: tags
        env:
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
          STABLE_TAG: ${{ steps.version.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          tags=()
          # Keep development SHA tags separate from stable release stamps.
          if [[ -n "$STABLE_TAG" ]]; then
            candidates=("$STABLE_TAG")
          else
            candidates=("sha-$SOURCE_SHA")
          fi
          for tag in "${candidates[@]}"; do
            if docker buildx imagetools inspect "$IMAGE:$tag" > /dev/null 2> inspect-error; then
              echo "Preserving existing immutable tag $IMAGE:$tag"
            elif grep -Eqi 'manifest unknown|not found' inspect-error; then
              tags+=("$IMAGE:$tag")
            else
              cat inspect-error >&2
              rm -f inspect-error
              exit 1
            fi
          done
          rm -f inspect-error
          if [[ -z "$STABLE_TAG" && ( "$GITHUB_REF" == refs/heads/main || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]]; then
            tags+=("$IMAGE:dev")
          fi
          {
            echo 'tags<<TAGS'
            printf '%s\n' "${tags[@]}"
            echo TAGS
            echo "publish=$([[ ${#tags[@]} -gt 0 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish client image
        id: build
        if: steps.tags.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/pagnet-code/pagnet
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Verify published platforms
        if: steps.tags.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | index("amd64") != null and index("arm64") != null'

      - name: Update latest from the immutable stable image
        if: steps.version.outputs.stable != ''
        env:
          STABLE_TAG: ${{ steps.version.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          newest_stable="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [[ "$STABLE_TAG" != "$newest_stable" ]]; then
            echo "Preserving latest: $STABLE_TAG is not the newest stable tag ($newest_stable)"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$STABLE_TAG"
